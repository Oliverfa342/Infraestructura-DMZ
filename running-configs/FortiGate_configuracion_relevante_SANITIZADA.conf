# FortiGate-VM64-KVM / FortiOS 7.0.9
# Extracto fiel de interfaces, DHCP, objetos y politicas del respaldo de la practica.
# Sin hashes, UUID, credenciales ni configuracion predeterminada extensa.
# SOLO DOCUMENTACION: no sustituye un backup de restauracion.
# La configuracion y la demostracion del FortiGate se realizaron mediante GUI.

config system interface
    edit "port1"
        set ip 192.168.200.2 255.255.255.0
        set allowaccess ping https http
    next
    edit "port3"
        set ip 10.15.72.1 255.255.255.240
        set allowaccess ping
        set alias "DMZ-SERVIDORES"
        set role dmz
    next
    edit "port4"
        set mode dhcp
        set alias "WAN-INTERNET"
        set role wan
        set dns-server-override disable
    next
    edit "VLAN10-USUARIOS"
        set ip 10.15.71.1 255.255.255.128
        set allowaccess ping
        set interface "port2"
        set vlanid 10
        set role lan
    next
    edit "VLAN20-USUARIOS"
        set ip 10.15.71.129 255.255.255.128
        set allowaccess ping
        set interface "port2"
        set vlanid 20
        set role lan
    next
end

config system dhcp server
    edit 2
        set lease-time 86400
        set dns-service local
        set default-gateway 10.15.71.1
        set netmask 255.255.255.128
        set interface "VLAN10-USUARIOS"
        config ip-range
            edit 1
                set start-ip 10.15.71.2
                set end-ip 10.15.71.126
            next
        end
    next
    edit 3
        set lease-time 86400
        set dns-service local
        set default-gateway 10.15.71.129
        set netmask 255.255.255.128
        set interface "VLAN20-USUARIOS"
        config ip-range
            edit 1
                set start-ip 10.15.71.130
                set end-ip 10.15.71.254
            next
        end
    next
end

config firewall address
    edit "NET-VLAN10"
        set subnet 10.15.71.0 255.255.255.128
    next
    edit "NET-VLAN20"
        set subnet 10.15.71.128 255.255.255.128
    next
    edit "NET-DMZ"
        set subnet 10.15.72.0 255.255.255.240
    next
    edit "SRV-CAJA"
        set subnet 10.15.72.2 255.255.255.255
    next
    edit "SRV-INVENTARIO"
        set subnet 10.15.72.3 255.255.255.255
    next
    edit "SRV-DB"
        set subnet 10.15.72.4 255.255.255.255
    next
    edit "UPDATE-ALPINE"
        set type fqdn
        set fqdn "dl-cdn.alpinelinux.org"
    next
end

config firewall addrgrp
    edit "GRP-LAN"
        set member "NET-VLAN10" "NET-VLAN20"
    next
    edit "GRP-SERVIDORES"
        set member "SRV-CAJA" "SRV-DB" "SRV-INVENTARIO"
    next
end

config firewall policy
    edit 1
        set name "VLAN10-INVENTARIO-BLOCKPAGE"
        set srcintf "VLAN10-USUARIOS"
        set dstintf "port3"
        set action accept
        set srcaddr "VLAN10-USUARIOS address"
        set dstaddr "SRV-INVENTARIO"
        set schedule "always"
        set service "HTTP"
        set utm-status enable
        set inspection-mode proxy
        set ssl-ssh-profile "certificate-inspection"
        set webfilter-profile "BLOQUEO-INVENTARIO"
        set logtraffic all
    next
    edit 2
        set name "VLAN10-INVENTARIO-DENY"
        set srcintf "VLAN10-USUARIOS"
        set dstintf "port3"
        set srcaddr "NET-VLAN10"
        set dstaddr "SRV-INVENTARIO"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "VLAN10-SSH-DENY"
        set srcintf "VLAN10-USUARIOS"
        set dstintf "port3"
        set srcaddr "NET-VLAN10"
        set dstaddr "GRP-SERVIDORES"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
    edit 4
        set name "VLAN20-SSH-ALLOW"
        set srcintf "VLAN20-USUARIOS"
        set dstintf "port3"
        set action accept
        set srcaddr "NET-VLAN20"
        set dstaddr "GRP-SERVIDORES"
        set schedule "always"
        set service "SSH"
        set logtraffic all
    next
    edit 5
        set name "VLAN10-CAJA-ALLOW"
        set srcintf "VLAN10-USUARIOS"
        set dstintf "port3"
        set action accept
        set srcaddr "NET-VLAN10"
        set dstaddr "SRV-CAJA"
        set schedule "always"
        set service "HTTP" "HTTPS"
    next
    edit 6
        set name "VLAN20-CAJA-ALLOW"
        set srcintf "VLAN20-USUARIOS"
        set dstintf "port3"
        set action accept
        set srcaddr "NET-VLAN20"
        set dstaddr "SRV-CAJA"
        set schedule "always"
        set service "HTTP" "HTTPS"
    next
    edit 7
        set name "VLAN20-INVENTARIO-ALLOW"
        set srcintf "VLAN20-USUARIOS"
        set dstintf "port3"
        set action accept
        set srcaddr "NET-VLAN20"
        set dstaddr "SRV-INVENTARIO"
        set schedule "always"
        set service "HTTP" "HTTPS"
    next
    edit 10
        set name "DMZ-UPDATES-ALLOW"
        set srcintf "port3"
        set dstintf "port4"
        set action accept
        set srcaddr "NET-DMZ"
        set dstaddr "UPDATE-ALPINE"
        set schedule "always"
        set service "HTTPS"
        set nat enable
    next
    edit 9
        set name "DMZ-INTERNET-DENY"
        set srcintf "port3"
        set dstintf "port4"
        set srcaddr "NET-DMZ"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

# Web Filter: perfil BLOQUEO-INVENTARIO con URL wildcard "*" bloqueada
# sobre trafico HTTP de la regla VLAN10-INVENTARIO-BLOCKPAGE.
# Replacement Message HTTP "url-block" personalizado: ACCESO DENEGADO.
# El trafico no permitido hacia LAN desde DMZ corresponde al implicit deny.
